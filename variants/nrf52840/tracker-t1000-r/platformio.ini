[env:tracker-t1000-r]
custom_meshtastic_support_level = 1
custom_meshtastic_images = tracker-t1000-r.svg
custom_meshtastic_tags = Seeed

extends = nrf52840_base
board = tracker-t1000-r
board_level = pr
custom_meshtastic_hw_model = 71
custom_meshtastic_hw_model_slug = TRACKER_T1000_R
custom_meshtastic_architecture = nrf52840
custom_meshtastic_display_name = Seeed SenseCAP T1000-R
custom_meshtastic_actively_supported = true
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/tracker-t1000-r
  -Isrc/platform/nrf52/softdevice
  -Isrc/platform/nrf52/softdevice/nrf52
  -DTRACKER_T1000_R
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_WIFI=1
  ; GPS logs a fix every 5 seconds
  -DUSERPREFS_CONFIG_GPS_UPDATE_INTERVAL=5
  ; Broadcast position every 5 seconds (only effective on a private channel;
  ; the default public channel enforces a 1-hour minimum to prevent mesh flooding)
  -DUSERPREFS_CONFIG_POSITION_BROADCAST_INTERVAL=5
  ; Disable smart/distance-based position suppression so the fixed 5s interval is respected
  -DUSERPREFS_CONFIG_SMART_POSITION_ENABLED=0
  ; Disable position on the public/default channel (channel 0 precision=0 means
  ; sendOurPosition() will never select it). GPS will not broadcast at all until
  ; the user configures a private channel (custom PSK + precision) via the app.
  -DUSERPREFS_CHANNEL_0_PRECISION=0
  ; Enable MQTT module by default so a nearby gateway node can relay to a broker.
  ; MQTT uplink must be enabled on the private channel via the app.
  -DUSERPREFS_MQTT_ENABLED=1
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/tracker-t1000-r>
lib_deps = 
  ${nrf52840_base.lib_deps}
  # TODO renovate
  https://github.com/meshtastic/QMA6100P_Arduino_Library/archive/14c900b8b2e4feaac5007a7e41e0c1b7f0841136.zip
debug_tool = jlink
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
upload_protocol = nrfutil
